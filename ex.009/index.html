<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Flex</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <label for="btnMenu" onclick="menu()">&#9776</label>
    <nav id="nav">
        <a href="">Link 1</a>
        <a href="">Link 2</a>
        <a href="">Link 3</a>
        <a href="">Link 4</a>
    </nav>

    <section>
        <h2> Contato </h2>

        <div class="row">
            <div class="col25">
                <label for="">Nome: </label>
            </div>
            <div class="col75">
                <input type="text" placeholder="Digite seu nome...">
            </div>
        </div>

        <div class="row">
            <div class="col25">
                <label for="">E-mail: </label>
            </div>
            <div class="col75">
                <input type="email" placeholder="Digite seu email...">
            </div>
        </div>

        <div class="row">
            <div class="col25">
                <label for="">Mensagem: </label>
            </div>
            <div class="col75">
                <textarea name="" id="" placeholder="Digite sua mensagem..."></textarea >
            </div>
        

        </div>
    </section>

    <section>
        <div></div>
        <div></div>
    </section>
